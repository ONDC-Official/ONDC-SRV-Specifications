search:
  message:
    intent:
      $ref: "./TagGroup.yaml#/intent"
on_search:
  message:
    catalog:
      $ref: "./TagGroup.yaml#/catalog"

select:
  message:
    order:
      items:
        tags:
          - code: NEGOTIATION_BAP
            description: Buyer sends the negotiation terms (Required if negotiation by attribute)
            reference: <PR/Issue/Discussion Links md format text>
            list:
              $ref: "./Tag.yaml#/NEGOTIATION_BAP"

on_select:
  message:
    order:
      items:
        tags:
          - code: NEGOTIATION_BAP
            description: Buyer selected negotiation terms (Required if negotiation by attribute)
            reference: <PR/Issue/Discussion Links md format text>
            list:
              $ref: "./Tag.yaml#/NEGOTIATION_BAP"
          - code: NEGOTIATION_BPP
            description: The seller provides the attribute associated with it along with counter offer (Required if negotiation by attribute)
            reference: <PR/Issue/Discussion Links md format text>
            list:
              $ref: "./Tag.yaml#/NEGOTIATION_BPP"
      quote:
        breakup:
          $ref: "./TagGroup.yaml#/order/quote/breakup"

init:
  message:
    order:
      items:
        $ref: "./TagGroup.yaml#/order/items"

on_init:
  message: &ref1
    order:
      $ref: "./TagGroup.yaml#/order"

confirm:
  message: *ref1

on_status:
  message: *ref1

update:
  message: &ref2
    order:
      payments:
        $ref: "./TagGroup.yaml#/order/payments"
      quote:
        breakup:
          tags:
            $ref: "./TagGroup.yaml#/order/quote/breakup/tags"
        item:
          tags:
            - code: attributes
              description: Update parameter for attributes
              reference: <PR/Issue/Discussion Links md format text>
              list:
                $ref: "./Tag.yaml#/attributes"
on_update:
  message: *ref2
